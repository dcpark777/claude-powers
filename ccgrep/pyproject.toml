[project]
name = "ccgrep"
version = "0.1.0"
description = "Search your Claude Code session history — for you (TUI) and for Claude (--json)"
requires-python = ">=3.10"
dependencies = ["textual>=0.60"]

[project.scripts]
ccgrep = "ccgrep.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ccgrep*"]
